                  img.onclick = function() { openImageViewer(this.src, this.alt); };
                  imgWrap.appendChild(img);
                  filePreview.appendChild(imgWrap);
                  var actions = document.createElement('div');
                  actions.className = 'file-preview-actions';
                  var nameSpan = document.createElement('span');
                  nameSpan.className = 'file-preview-name';
                  nameSpan.textContent = fName;
                  var dlLink = document.createElement('a');
                  dlLink.className = 'file-preview-dl';
                  dlLink.href = blobURL;
                  dlLink.download = fName;
                  dlLink.textContent = t('download');
                  actions.appendChild(nameSpan);
                  actions.appendChild(dlLink);
                  filePreview.appendChild(actions);
                } else {
                  // Document — download link
                  var docRow = document.createElement('div');
                  docRow.className = 'file-preview-doc';
                  var icon = document.createElement('span');
                  icon.className = 'file-preview-icon';
                  icon.textContent = '\uD83D\uDCC4';
                  var nameSpan2 = document.createElement('span');
                  nameSpan2.className = 'file-preview-name';
                  nameSpan2.textContent = fName;
                  var dlLink2 = document.createElement('a');
                  dlLink2.className = 'file-preview-dl';
                  dlLink2.href = blobURL;
                  dlLink2.download = fName;
                  dlLink2.textContent = t('download');
                  docRow.appendChild(icon);
                  docRow.appendChild(nameSpan2);
                  docRow.appendChild(dlLink2);
                  filePreview.appendChild(docRow);
                }
                resultEl.appendChild(filePreview);
                resultEl.classList.add('has-file');
                // Auto-expand tool card to show preview
                tc.classList.add('expanded');
              }
            }
            delete activeToolCards[matchKey];
          }
          scrollToBottom();
          break;

        case 'done':
          if (thinkingEl) {
            thinkingEl.classList.add('collapsed', 'done');
            thinkingEl = null;
            thinkingText = '';
          }
          if (currentAssistantEl && !currentAssistantText.trim()) {
            currentAssistantEl.remove();
          } else if (currentAssistantContentEl && currentAssistantText.trim()) {
            currentAssistantContentEl.innerHTML = renderMarkdown(currentAssistantText);
          }
          currentAssistantEl = null;
          currentAssistantContentEl = null;
          currentAssistantText = '';
          // Mark any remaining tool cards as done
          Object.values(activeToolCards).forEach(function(c) {
            c.className = 'tool-card done';
            var st = c.querySelector('.tool-card-status');
            if (st) st.textContent = t('complete');
          });
          activeToolCards = {};
          nextThinkingIsReflection = false;
          setSending(false);
          // Session list will be updated by ws.onopen on reconnect
          break;

        case 'error':
          if (thinkingEl) {
            thinkingEl.classList.add('collapsed', 'done');
            thinkingEl = null;
            thinkingText = '';
          }
          if (msg.message) appendMessage('assistant', t('error') + msg.message);
          if (currentAssistantEl && !currentAssistantText.trim()) {
            currentAssistantEl.remove();
          }
          currentAssistantEl = null;
          currentAssistantContentEl = null;
          currentAssistantText = '';
          Object.values(activeToolCards).forEach(function(c) {
            c.className = 'tool-card done';
          });
          activeToolCards = {};
          nextThinkingIsReflection = false;
          setSending(false);
          break;

        case 'session_created':
          setCurrentSession(msg.session.id);
          if (!sending) document.getElementById('chatContainer').innerHTML = '';
          // Debounced session list refresh
          if (!loadSessionsTimer) { loadSessions(); }
          break;

        case 'session_switched':
          var prevId = currentSessionId;
          var wasSending = sending;
          setCurrentSession(msg.session.id);
          var chatContainer = document.getElementById('chatContainer');
          var sameSession = (msg.session.id === prevId);
          // ALWAYS re-render on reconnect or session change to clear stale streaming elements.
          // The snapshot (if run is active) will add current state on top of clean history.
          if (!sameSession || !chatContainer.hasChildNodes() || wasSending) {
            renderSessionMessages(msg.session);
          }
          // Wait briefly for run_active. If it doesn't arrive, the run finished while disconnected.
          if (wasSending) {
            if (window._runActiveTimeout) clearTimeout(window._runActiveTimeout);
            window._runActiveTimeout = setTimeout(function() {
              if (sending) resetStreamingState();
            }, 1200);
          }
          if (!loadSessionsTimer) { loadSessions(); }
          break;

        case 'title_updated':
          var titleTarget = document.querySelector('#sessionList .session-item[data-sid="' + msg.sessionId + '"] .session-title');
          if (titleTarget) titleTarget.textContent = msg.title;
          break;

        case 'timer_fired':
          // Timer fired — refresh indicator, show executing state
          pollTimerCount();
          if (msg.sessionId !== currentSessionId) {
            showToast('⏰ Timer: ' + msg.label);
          }
          break;

        case 'timer_chain_next':
          // Chain timer scheduled next iteration — refresh countdown
          pollTimerCount();
          break;

        case 'timer_chain_done':
          // Chain timer completed all iterations
          pollTimerCount();
          showToast((currentLang === 'zh' ? '循环完成: ' : 'Loop done: ') + msg.label + ' (' + msg.totalFired + 'x)');
          break;

        case 'run_active':
          // Backend has an active agent run for this session — enter streaming mode.
          // A run_snapshot will follow with the current state.
          if (window._runActiveTimeout) { clearTimeout(window._runActiveTimeout); window._runActiveTimeout = null; }
          setSending(true);
          // Reset streaming state — snapshot will rebuild it cleanly
          thinkingEl = null;
          thinkingText = '';
          currentAssistantEl = null;
          currentAssistantContentEl = null;
          currentAssistantText = '';
          activeToolCards = {};
          break;

        case 'run_snapshot':
          // One-shot state restore: render entire current run state in a single batch.
          // This replaces the old "replay 100+ events" approach that caused mobile refresh storm.
          if (window._runActiveTimeout) { clearTimeout(window._runActiveTimeout); window._runActiveTimeout = null; }
          var snapContainer = document.getElementById('chatContainer');

          // Remove the last assistant message (it's the stale intermediate save from session data)
          var staleAssistant = snapContainer.querySelector('.message.assistant:last-child');
          if (staleAssistant) staleAssistant.remove();

          // 1. Render thinking block (collapsed)
          if (msg.thinkingText) {
            var snapThink = document.createElement('div');
            snapThink.className = 'thinking-block collapsed done';
            snapThink.innerHTML =
              '<div class="thinking-header">' +
              '<div class="thinking-icon"></div>' +
              '<span class="thinking-label">' + t('thinking') + '</span>' +
              '<span class="thinking-chevron">\u25BC</span>' +
              '</div>' +
              '<div class="thinking-content"></div>';
            snapThink.querySelector('.thinking-content').textContent = msg.thinkingText;
            snapContainer.appendChild(snapThink);
          }

          // 2. Render completed tool calls
          if (msg.toolCalls) {
            for (var sti = 0; sti < msg.toolCalls.length; sti++) {
              var stool = msg.toolCalls[sti];
              toolCallCounter++;
              var scard = document.createElement('div');
              scard.className = 'tool-card done';
              scard.innerHTML =
                '<div class="tool-card-header" onclick="this.parentElement.classList.toggle(\'expanded\')">' +
                  '<div class="tool-card-spinner"></div>' +
                  '<div class="tool-card-check">' + CHECK_SVG + '</div>' +
                  '<div class="tool-card-info">' +
                    '<span class="tool-card-name">' + esc(stool.name) + '</span>' +
                    '<span class="tool-card-status">' + t('complete') + '</span>' +
                  '</div>' +
                  '<span class="tool-card-chevron">\u25B6</span>' +
                '</div>' +
                '<div class="tool-card-result"></div>';
              var sresult = scard.querySelector('.tool-card-result');
              sresult.textContent = stool.result || '';
              // Embed file preview if present
              if (stool.file && stool.file.data && stool.file.mime && stool.file.mime.startsWith('image/')) {
                var sfp = document.createElement('div');
                sfp.className = 'tool-file-preview';
                var siw = document.createElement('div');
                siw.className = 'file-preview-img-wrap';
                var sim = document.createElement('img');
                sim.src = 'data:' + stool.file.mime + ';base64,' + stool.file.data;
                sim.alt = stool.file.name || 'image';
                sim.className = 'file-preview-img';
                sim.onclick = function() { openImageViewer(this.src, this.alt); };
                siw.appendChild(sim);
                sfp.appendChild(siw);
                sresult.appendChild(sfp);
                sresult.classList.add('has-file');
                scard.classList.add('expanded');
              }
              snapContainer.appendChild(scard);
            }
          }

          // 3. Render active tool call (still running)
          if (msg.activeTool) {
            toolCallCounter++;
            var atKey = (msg.activeTool.name || 'tool') + '_' + toolCallCounter;
            var atCard = document.createElement('div');
            atCard.className = 'tool-card running';
            atCard.dataset.toolKey = atKey;
            atCard.innerHTML =
              '<div class="tool-card-header" onclick="this.parentElement.classList.toggle(\'expanded\')">' +
                '<div class="tool-card-spinner"></div>' +
                '<div class="tool-card-check">' + CHECK_SVG + '</div>' +
                '<div class="tool-card-info">' +
                  '<span class="tool-card-name">' + esc(msg.activeTool.name) + '</span>' +
                  '<span class="tool-card-status">' + t('running') + '</span>' +
                '</div>' +
                '<span class="tool-card-chevron">\u25B6</span>' +
              '</div>' +
              '<div class="tool-card-result"></div>';
            snapContainer.appendChild(atCard);
            activeToolCards[atKey] = atCard;
          }

          // 4. Render grid/soul cards (reuse existing rendering from renderSessionMessages format)
          if (msg.grids) {
            for (var sgi = 0; sgi < msg.grids.length; sgi++) {
              var sgd = msg.grids[sgi];
              var sgCard = document.createElement('div');
              sgCard.className = 'grid-plan-card ' + (sgd.status || 'executing');
              sgCard.id = 'grid-plan-' + sgd.planId;
              var sgStatus = sgd.status === 'completed' ? t('gridComplete') :
                             sgd.status === 'failed' ? t('gridFailed') :
                             sgd.status === 'executing' ? t('gridExecuting') : t('gridPlanning');
              var sgHtml = '<div class="grid-plan-header">' +
                (sgd.status === 'executing' || sgd.status === 'planning' ? '<div class="grid-plan-spinner"></div>' : '') +
                '<span class="grid-plan-title">' + t('gridPlanTitle') + ': ' + esc(sgd.goal || '').slice(0, 80) + '</span>' +
                '<span class="grid-plan-status">' + sgStatus + '</span>' +
              '</div><div class="grid-plan-steps">';
              if (sgd.steps) {
                for (var sgsi = 0; sgsi < sgd.steps.length; sgsi++) {
                  var sgs = sgd.steps[sgsi];
                  var sgsStatus = sgs.status || 'pending';
                  var sgsNum = sgsStatus === 'completed' ? '\u2713' : sgsStatus === 'failed' ? '\u2717' : sgsStatus === 'running' ? '\u25B6' : String(sgsi + 1);
                  sgHtml += '<div class="grid-plan-step ' + sgsStatus + '">' +
                    '<div class="step-number">' + sgsNum + '</div>' +
                    '<div class="step-info"><div class="step-name">' + esc(sgs.name || '') + '</div>' +
                    '<div class="step-desc">' + esc(sgs.description || '').slice(0, 100) + '</div></div></div>';
                }
              }
              sgHtml += '</div>';
              sgCard.innerHTML = sgHtml;
              snapContainer.appendChild(sgCard);
            }
          }

          if (msg.souls) {
            for (var ssi = 0; ssi < msg.souls.length; ssi++) {
              var ssd = msg.souls[ssi];
              var ssCard = document.createElement('div');
              ssCard.className = 'soul-card ' + (ssd.status || 'thinking');
              ssCard.id = 'soul-' + ssd.soulId;
              var ssHtml = '<div class="soul-header">' +
                '<span class="soul-title">' + esc(ssd.question || '').slice(0, 80) + '</span>' +
              '</div><div class="soul-units">';
              if (ssd.units) {
                for (var sui = 0; sui < ssd.units.length; sui++) {
                  var su = ssd.units[sui];
                  ssHtml += '<div class="soul-unit ' + (su.status || 'running') + '">' +
                    '<span class="soul-emoji">' + (su.emoji || '') + '</span>' +
                    '<span class="soul-role">' + esc(su.label || su.role) + '</span>' +
                    '<span class="soul-unit-status">' + (su.status === 'done' ? '\u2713' : '\u23F3') + '</span>' +
                  '</div>';
                }
              }
              ssHtml += '</div>';
              if (ssd.synthesis) ssHtml += '<div class="soul-synthesis">' + esc(ssd.synthesis).slice(0, 200) + '</div>';
              ssCard.innerHTML = ssHtml;
              snapContainer.appendChild(ssCard);
            }
          }

          if (msg.swarms) {
            for (var swi = 0; swi < msg.swarms.length; swi++) {
              var swd = msg.swarms[swi];
              var swCard = document.createElement('div');
              swCard.className = 'swarm-card ' + (swd.status || 'executing');
              swCard.id = 'swarm-' + swd.planId;
              var swHtml = '<div class="swarm-header">' +
                '<span class="swarm-title">' + esc(swd.goal || '').slice(0, 80) + '</span>' +
              '</div><div class="swarm-tasks">';
              if (swd.tasks) {
                for (var sti2 = 0; sti2 < swd.tasks.length; sti2++) {
                  var st = swd.tasks[sti2];
                  swHtml += '<div class="swarm-task ' + (st.status || 'pending') + '">' +
                    '<span class="swarm-task-name">' + esc(st.name || '') + '</span>' +
                    '<span class="swarm-task-status">' + (st.status === 'done' || st.status === 'completed' ? '\u2713' : st.status === 'running' ? '\u23F3' : '\u2022') + '</span>' +
                  '</div>';
                }
              }
              swHtml += '</div>';
              swCard.innerHTML = swHtml;
              snapContainer.appendChild(swCard);
            }
          }

          // 5. Render accumulated text
          if (msg.accumulatedText) {
            currentAssistantEl = appendMessageEl('assistant');
            currentAssistantContentEl = currentAssistantEl.querySelector('.msg-content');
            currentAssistantText = msg.accumulatedText;
            if (msg.runStatus === 'running') {
              // Still streaming — render as plain text (will be updated by future token events)
              currentAssistantContentEl.textContent = stripLeakedXML(currentAssistantText);
            } else {
              // Run finished — render as markdown
              currentAssistantContentEl.innerHTML = renderMarkdown(currentAssistantText);
              currentAssistantEl = null;
              currentAssistantContentEl = null;
              currentAssistantText = '';
            }
          }

          // 6. Set correct streaming state
          if (msg.runStatus !== 'running') {
            setSending(false);
          }

          scrollToBottom();
          break;

        case 'replay_done':
          // Legacy: no longer used (replaced by run_snapshot), kept for backward compat
          break;

        case 'new_message':
          // Another device sent a message on the same session — render it in real-time
          if (msg.sessionId === currentSessionId) {
            appendMessage(msg.role, msg.content);
            // Render file cards if present
            if (msg.files && msg.files.length > 0) {
              var container = document.getElementById('chatContainer');
              for (var nfi = 0; nfi < msg.files.length; nfi++) {
                var nf = msg.files[nfi];
                var nfd = document.createElement('div');
                nfd.className = 'message user';
                nfd.innerHTML = '<div class="user-file-card">' +
                  '<span class="user-file-card-icon">' + getFileIcon(nf.mime) + '</span>' +
                  '<div class="user-file-card-info">' +
                    '<div class="user-file-card-name">' + esc(nf.name) + '</div>' +
                    '<div class="user-file-card-meta">' + formatFileSize(nf.size) + '</div>' +
                  '</div></div>';
                container.appendChild(nfd);
              }
              scrollToBottom();
            }
          }
          break;

        case 'session_updated':
          // Another device finished a run on this session — reload messages
          if (msg.sessionId === currentSessionId && !sending) {
            fetch('/api/sessions/' + encodeURIComponent(msg.sessionId))
              .then(function(r) { return r.ok ? r.json() : null; })
              .then(function(session) {
                if (session && session.id === currentSessionId && !sending) {
                  renderSessionMessages(session);
                }
              })
              .catch(function() {});
          }
          // Also refresh session list (title/message count may have changed)
          if (!loadSessionsTimer) { loadSessions(); }
          break;

        case 'skill_toggled':
          if (msg.active) activeSkills.add(msg.name);
          else activeSkills.delete(msg.name);
          try { localStorage.setItem('piweb_activeSkills', JSON.stringify(Array.from(activeSkills))); } catch(e) {}
          break;

        case 'grid_planning': {
          var planCard = document.createElement('div');
          planCard.className = 'grid-plan-card planning';
          planCard.id = 'grid-plan-' + msg.planId;
          planCard.innerHTML =
            '<div class="grid-plan-header">' +
              '<div class="grid-plan-spinner"></div>' +
              '<span class="grid-plan-title">' + t('gridPlanTitle') + ': ' + esc(msg.goal).slice(0, 80) + '</span>' +
              '<span class="grid-plan-status">' + t('gridPlanning') + '</span>' +
            '</div>' +
            '<div class="grid-plan-steps"></div>';
          document.getElementById('chatContainer').appendChild(planCard);
          scrollToBottom();
          break;
        }

        case 'grid_plan_ready': {
          var card = document.getElementById('grid-plan-' + msg.planId);
          if (!card) {
            card = document.createElement('div');
            card.className = 'grid-plan-card';
            card.id = 'grid-plan-' + msg.planId;
            card.innerHTML = '<div class="grid-plan-header"><span class="grid-plan-title"></span><span class="grid-plan-status"></span></div><div class="grid-plan-steps"></div>';
            document.getElementById('chatContainer').appendChild(card);
          }
          card.className = 'grid-plan-card ready';
          var statusEl = card.querySelector('.grid-plan-status');
          if (statusEl) statusEl.textContent = t('gridStepOf') + ' ' + msg.steps.length;
          var stepsContainer = card.querySelector('.grid-plan-steps');
          if (stepsContainer) {
            var stepsHtml = '';
            for (var si = 0; si < msg.steps.length; si++) {
              var stepData = msg.steps[si];
              var skillBadges = '';
              if (stepData.skills && stepData.skills.length > 0) {
                for (var ski = 0; ski < stepData.skills.length; ski++) {
                  skillBadges += '<span class="skill-badge">' + esc(stepData.skills[ski]) + '</span>';
                }
              }
              stepsHtml += '<div class="grid-plan-step pending" id="grid-plan-step-' + msg.planId + '-' + si + '">' +
                '<div class="step-number">' + (si + 1) + '</div>' +
                '<div class="step-info"><div class="step-name">' + esc(stepData.name) + skillBadges + '</div>' +
                '<div class="step-desc">' + esc(stepData.description).slice(0, 100) + '</div></div>' +
                '<div class="step-spinner"></div>' +
              '</div>';
            }
            stepsContainer.innerHTML = stepsHtml;
          }
          if (msg.skillGaps && msg.skillGaps.length > 0) {
            var gapsHtml = '<div class="grid-plan-gaps"><div class="grid-plan-gaps-title">' + t('gridSkillGap') + '</div>';
            for (var gi = 0; gi < msg.skillGaps.length; gi++) {
              var gap = msg.skillGaps[gi];
              gapsHtml += '<div class="grid-plan-gap-item">\u26A0 <strong>' + esc(gap.name) + '</strong>: ' + esc(gap.reason) + ' (' + esc(gap.step) + ')</div>';
            }
            gapsHtml += '</div>';
            card.insertAdjacentHTML('beforeend', gapsHtml);
          }
          scrollToBottom();
          break;
        }

        case 'grid_step_start': {
          var planCard2 = document.getElementById('grid-plan-' + msg.planId);
          if (planCard2) {
            planCard2.className = 'grid-plan-card executing';
            var statusEl2 = planCard2.querySelector('.grid-plan-status');
            if (statusEl2) statusEl2.textContent = t('gridExecuting') + ' ' + (msg.index + 1) + '/' + msg.total;
          }
          var stepEl2 = document.getElementById('grid-plan-step-' + msg.planId + '-' + msg.index);
          if (stepEl2) stepEl2.className = 'grid-plan-step running';
          scrollToBottom();
          break;
        }

        case 'grid_step_end': {
          var stepEl3 = document.getElementById('grid-plan-step-' + msg.planId + '-' + msg.index);
          if (stepEl3) {
            stepEl3.className = 'grid-plan-step ' + (msg.status || 'completed');
            var numEl = stepEl3.querySelector('.step-number');
            if (numEl) numEl.textContent = msg.status === 'completed' ? '\u2713' : '\u2717';
          }
          scrollToBottom();
          break;
        }

        case 'grid_complete': {
          var planCard3 = document.getElementById('grid-plan-' + msg.planId);
          if (planCard3) {
            planCard3.className = 'grid-plan-card completed';
            var statusEl3 = planCard3.querySelector('.grid-plan-status');
            if (statusEl3) statusEl3.textContent = t('gridComplete');
            planCard3.insertAdjacentHTML('beforeend', '<div class="grid-plan-footer">\u2714 ' + t('gridComplete') + '</div>');
          }
          scrollToBottom();
          break;
        }

        case 'grid_error': {
          var planCard4 = document.getElementById('grid-plan-' + msg.planId);
          if (planCard4) {
            planCard4.className = 'grid-plan-card failed';
            var statusEl4 = planCard4.querySelector('.grid-plan-status');
            if (statusEl4) statusEl4.textContent = t('gridFailed');
            planCard4.insertAdjacentHTML('beforeend', '<div class="grid-plan-footer">\u2718 ' + esc(msg.message) + '</div>');
          }
          scrollToBottom();
          break;
        }

        // ===== Soul Events =====
        case 'soul_start': {
          var soulCard = document.createElement('div');
          soulCard.className = 'soul-card thinking';
          soulCard.id = 'soul-' + msg.soulId;
          soulCard.innerHTML =
            '<div class="soul-header">' +
              '<div class="soul-spinner"></div>' +
              '<span class="soul-title">' + t('soulTitle') + ': ' + esc(msg.question || '').slice(0, 80) + '</span>' +
              '<span class="soul-status">' + t('soulThinking') + '</span>' +
            '</div>' +
            '<div class="soul-units"></div>';
          document.getElementById('chatContainer').appendChild(soulCard);
          scrollToBottom();
          break;
        }
        case 'soul_unit_start': {
          var soulEl = document.getElementById('soul-' + msg.soulId);
          if (soulEl) {
            var unitsContainer = soulEl.querySelector('.soul-units');
            if (unitsContainer) {
              var unitDiv = document.createElement('div');
              unitDiv.className = 'soul-unit running';
              unitDiv.id = 'soul-unit-' + msg.soulId + '-' + msg.index;
              unitDiv.innerHTML =
                '<div class="soul-unit-header">' +
                  '<span class="soul-unit-role">' + (msg.emoji || '') + ' ' + esc(msg.label) + '</span>' +
                  '<div class="soul-unit-spinner"></div>' +
                '</div>' +
                '<div class="soul-unit-output">' + t('soulThinking') + '</div>';
              unitsContainer.appendChild(unitDiv);
            }
          }
          scrollToBottom();
          break;
        }
        case 'soul_unit_done': {
          var unitEl = document.getElementById('soul-unit-' + msg.soulId + '-' + msg.index);
          if (unitEl) {
            unitEl.className = 'soul-unit ' + (msg.status || 'completed');
            var outputEl = unitEl.querySelector('.soul-unit-output');
            if (outputEl) outputEl.textContent = msg.output || '';
          }
          scrollToBottom();
          break;
        }
        case 'soul_synthesizing': {
          var soulEl2 = document.getElementById('soul-' + msg.soulId);
          if (soulEl2) {
            soulEl2.className = 'soul-card synthesizing';
            var soulStatus = soulEl2.querySelector('.soul-status');
            if (soulStatus) soulStatus.textContent = t('soulSynthesizing');
          }
          scrollToBottom();
          break;
        }
        case 'soul_complete': {
          var soulEl3 = document.getElementById('soul-' + msg.soulId);
          if (soulEl3) {
            soulEl3.className = 'soul-card completed';
            var soulStatus2 = soulEl3.querySelector('.soul-status');
            if (soulStatus2) soulStatus2.textContent = t('soulComplete');
            soulEl3.insertAdjacentHTML('beforeend',
              '<div class="soul-synthesis">' +
                '<div class="soul-synthesis-label">' + t('soulSynthesis') + '</div>' +
                '<div class="soul-synthesis-text">' + esc(msg.synthesis || '') + '</div>' +
              '</div>'
            );
          }

    function wsSend(data) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(data));
      } else {
        showToast(t('connectionLost'), true);
        setSending(false);
      }
    }

    // ===== Session Management =====
    function setCurrentSession(id) {
      currentSessionId = id;
      try {
        if (id) localStorage.setItem('piweb_session', id);
        else localStorage.removeItem('piweb_session');
      } catch(e) {}
      updateSessionInfo();
    }

    // Debounced session loading to prevent flicker on rapid calls
    var loadSessionsTimer = null;
    var loadSessionsPending = false;
    async function loadSessions() {
      if (loadSessionsTimer) {
        loadSessionsPending = true; // coalesce: will run once after cooldown
        return;
      }
      loadSessionsTimer = true;
      try {
        var res = await fetch('/api/sessions');
        var sessions = await res.json();
        renderSessions(sessions);
      } catch(e) {}
      setTimeout(function() {
        loadSessionsTimer = null;
        if (loadSessionsPending) {
          loadSessionsPending = false;
          loadSessions();
        }
      }, 2000); // 2s cooldown to prevent rapid refetching
    }

    function renderSessions(sessions) {
      var el = document.getElementById('sessionList');
      if (!Array.isArray(sessions)) sessions = [];
      var valid = sessions.filter(function(s) { return s && s.id; });
      var recent = valid.filter(function(s) { return !s.archived; });
      var archived = valid.filter(function(s) { return s.archived; });

      // Render recent sessions
      var recentHtml = recent.map(function(s) {
        var msgCount = s.messageCount != null ? s.messageCount : 0;
        return '<div class="session-item-wrap">' +
          '<div class="session-item ' + (s.id === currentSessionId ? 'active' : '') + '" data-sid="' + esc(s.id) + '">' +
            '<div style="overflow:hidden;flex:1">' +
              '<div class="session-title">' + esc(s.title || 'Untitled') + '</div>' +
              '<div class="session-meta">' + msgCount + t('msgs') + '</div>' +
            '</div>' +
            '<button class="del-btn" title="Delete">\u00d7</button>' +
          '</div>' +
        '</div>';
      }).join('');

      // Render archive section if there are archived sessions
      var archiveHtml = '';
      if (archived.length > 0) {
        var wasOpen = el.querySelector('.archive-toggle.open') !== null;
        archiveHtml = '<div class="archive-toggle' + (wasOpen ? ' open' : '') + '" id="archiveToggle">' +
          '<svg width="12" height="12" viewBox="0 0 12 12"><path d="M4 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>' +
          '<span>' + t('archive') + ' (' + archived.length + ')</span>' +
        '</div>' +
        '<div class="archive-list' + (wasOpen ? ' open' : '') + '" id="archiveList">' +
        archived.map(function(s) {
          var msgCount = s.messageCount != null ? s.messageCount : 0;
          var dateStr = s.updatedAt ? new Date(s.updatedAt).toLocaleDateString() : '';
          return '<div class="session-item-wrap">' +
            '<div class="session-item archived' + (s.id === currentSessionId ? ' active' : '') + '" data-sid="' + esc(s.id) + '" title="' + esc(s.preview || '') + '">' +
              '<div style="overflow:hidden;flex:1">' +
                '<div class="session-title">' + esc(s.title || 'Untitled') + '</div>' +
                '<div class="session-meta">' + msgCount + t('msgs') + ' \u00b7 ' + dateStr + '</div>' +
              '</div>' +
              '<button class="del-btn" title="Delete">\u00d7</button>' +
            '</div>' +
          '</div>';
        }).join('') +
        '</div>';
      }

      var newHtml = recentHtml + archiveHtml;
      if (el.innerHTML !== newHtml) {
        el.innerHTML = newHtml;
        initSwipeDelete();
        // Archive toggle click handler
        var toggle = document.getElementById('archiveToggle');
        if (toggle) {
          toggle.addEventListener('click', function() {
            toggle.classList.toggle('open');
            var list = document.getElementById('archiveList');
            if (list) list.classList.toggle('open');
          });
        }
      }
    }

    // Event delegation for session list
    document.getElementById('sessionList').addEventListener('click', function(e) {
      var delBtn = e.target.closest('.del-btn');
      if (delBtn) {
        e.stopPropagation();
        var sid = delBtn.closest('.session-item').dataset.sid;
        if (sid) deleteSession(sid);
        return;
      }
      var item = e.target.closest('.session-item');
      if (item && item.dataset.sid) {
        switchSession(item.dataset.sid);
      }
    });

    function switchSession(id) {
      if (sending) {
        wsSend({ type: 'stop' });
        resetStreamingState();
      }
      wsSend({ type: 'switch_session', sessionId: id });
      if (window.innerWidth <= 768) toggleSidebar();
    }

    function newSession() {
      if (sending) {
        wsSend({ type: 'stop' });
        resetStreamingState();
      }
      wsSend({ type: 'new_session' });
      if (window.innerWidth <= 768) toggleSidebar();
    }

    async function deleteSession(id) {
      if (sending && currentSessionId === id) {
        wsSend({ type: 'stop' });
        resetStreamingState();
      }
      var wasCurrent = (currentSessionId === id);
      await fetch('/api/sessions/' + encodeURIComponent(id), { method: 'DELETE' });
      if (wasCurrent) {
        setCurrentSession(null);
        document.getElementById('chatContainer').innerHTML = '';
        // Auto-create a new session after deleting the current one
        wsSend({ type: 'new_session' });
      }
      // Debounced session list refresh
      if (!loadSessionsTimer) { loadSessions(); }
    }

    // ===== Swipe to Delete (mobile) =====
    function initSwipeDelete() {
      var items = document.querySelectorAll('.session-item-wrap');
      items.forEach(function(wrap) {
        var item = wrap.querySelector('.session-item');
        var startX = 0, currentX = 0, swiping = false;

        item.addEventListener('touchstart', function(e) {
          startX = e.touches[0].clientX;
          currentX = startX;
          swiping = true;
          item.style.transition = 'none';
        }, { passive: true });

        item.addEventListener('touchmove', function(e) {
          if (!swiping) return;
          currentX = e.touches[0].clientX;
          var diff = startX - currentX;
          if (diff > 5) {
            item.style.transform = 'translateX(' + (-Math.min(diff, 80)) + 'px)';
          } else if (diff < -5) {
            item.style.transform = '';
          }
        }, { passive: true });

        item.addEventListener('touchend', function() {
          if (!swiping) return;
          swiping = false;
          item.style.transition = 'transform 0.25s ease';
          var diff = startX - currentX;
          if (diff > 60) {
            item.style.transform = 'translateX(-100%)';
            item.style.opacity = '0';
            var sid = item.dataset.sid;
            setTimeout(function() { if (sid) deleteSession(sid); }, 250);
          } else {
            item.style.transform = '';
          }
        });
      });
    }

    function buildProviderSelect() {
      var sel = document.getElementById('setProvider');
      sel.innerHTML = '';
      var currentGroup = null;
      for (var i = 0; i < PROVIDERS.length; i++) {
        var p = PROVIDERS[i];
        if (p.group) {
          currentGroup = document.createElement('optgroup');
          currentGroup.label = t(p.group);
          sel.appendChild(currentGroup);
        } else {
          var opt = document.createElement('option');
          opt.value = p.value;
          opt.textContent = p.name;
          (currentGroup || sel).appendChild(opt);
        }
      }
    }

    function getPreset(value) {
      for (var i = 0; i < PROVIDERS.length; i++) {
        if (PROVIDERS[i].value === value) return PROVIDERS[i];
      }
      return null;
    }

    function findPresetByConfig(config) {
      // Try preset field first
      if (config.preset) {
        var p = getPreset(config.preset);
        if (p) return p.value;
      }
      // Try matching by baseURL
      if (config.baseURL) {
        for (var i = 0; i < PROVIDERS.length; i++) {
          var p = PROVIDERS[i];
          if (p.baseURL && config.baseURL.indexOf(p.baseURL.replace(/\/+$/, '')) === 0) return p.value;
        }
      }
      // Fallback by provider type
      if (config.provider === 'anthropic') return 'anthropic';
      return 'custom';
    }

    function onProviderChange(skipValueUpdate) {
      var sel = document.getElementById('setProvider');
      var preset = getPreset(sel.value);
      if (!preset) return;

      var baseURLField = document.getElementById('baseURLField');
      var apiKeyField = document.getElementById('apiKeyField');
      var baseURLInput = document.getElementById('setBaseURL');
      var modelInput = document.getElementById('setModel');
      var modelField = document.getElementById('modelField');
      var maxTokensField = document.getElementById('maxTokensField');
      var funnypiPlanSection = document.getElementById('funnypiPlanSection');
      var isFunnyPi = preset.value === 'funnypi';

      // FunnyPi mode: hide model/maxTokens, show plan A/B
      if (isFunnyPi) {
        baseURLField.style.display = 'none';
        if (!skipValueUpdate) baseURLInput.value = preset.baseURL;
        apiKeyField.style.display = '';
        modelField.style.display = 'none';
        maxTokensField.style.display = 'none';
        funnypiPlanSection.style.display = '';
        return;
      }

      // Non-FunnyPi: restore normal fields
      modelField.style.display = '';
      maxTokensField.style.display = '';
      funnypiPlanSection.style.display = 'none';

      // Fill baseURL - auto-populate preset default value only if user switched provider
      if (preset.value === 'custom') {
        baseURLField.style.display = '';
        if (!skipValueUpdate) baseURLInput.value = '';
        baseURLInput.placeholder = 'https://your-api-endpoint/v1';
      } else if (preset.baseURL) {
        baseURLField.style.display = '';
        if (!skipValueUpdate) baseURLInput.value = preset.baseURL;
      } else {
        baseURLField.style.display = 'none';
      }

      // API Key visibility
      if (preset.noKey) {
        apiKeyField.style.display = 'none';
      } else {
        apiKeyField.style.display = '';
      }

      // Model placeholder
      if (preset.models) {
        modelInput.placeholder = preset.models;
      } else {
        modelInput.placeholder = 'Leave empty for auto-detect';
      }
    }
