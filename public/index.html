    function openSettings() {
      buildProviderSelect();
      Promise.all([
        fetch('/api/settings').then(function(r) { return r.json(); }).catch(function() { return {}; }),
        fetch('/api/apikey').then(function(r) { return r.json(); }).catch(function() { return { hasKey: false }; }),
        fetch('/api/mcp/status').then(function(r) { return r.json(); }).catch(function() { return []; }),
        fetch('/api/skills').then(function(r) { return r.json(); }).catch(function() { return []; })
      ]).then(function(results) {
        var config = results[0];
        var keyStatus = results[1];
        var mcpServers = results[2];
        var allAvailableSkills = results[3];

        // Select the right preset
        var presetValue = findPresetByConfig(config);
        document.getElementById('setProvider').value = presetValue;

        document.getElementById('setBaseURL').value = config.baseURL || '';
        document.getElementById('setModel').value = config.model || '';
        document.getElementById('setMaxTokens').value = config.maxTokens || '';
        document.getElementById('setSystemPrompt').value = config.systemPrompt || '';

        // API Key — display saved key value so user can see and edit it
        if (keyStatus.hasKey && keyStatus.key) {
          document.getElementById('setApiKey').value = keyStatus.key;
          _originalApiKey = keyStatus.key;
        } else {
          document.getElementById('setApiKey').value = '';
          _originalApiKey = '';
        }
        var statusEl = document.getElementById('keyStatus');
        if (keyStatus.hasKey) {
          statusEl.textContent = t('keyConfigured');
          statusEl.style.color = 'var(--green)';
        } else {
          statusEl.textContent = t('noKeyConfigured');
          statusEl.style.color = 'var(--yellow)';
        }

        // Scheduler
        loadSchedulerUI(config);

        // Reflect endpoint
        loadReflectEndpointUI(config);

        // Vision endpoint
        loadVisionEndpointUI(config);

        // MCP JSON editor
        try {
          document.getElementById('setMCP').value = Object.keys(config.mcp || {}).length > 0
            ? JSON.stringify(config.mcp, null, 2) : '';
        } catch(e) {
          document.getElementById('setMCP').value = '';
        }

        // MCP toggle list
        renderMCPToggles(mcpServers);

        // Skills toggle list
        renderSkillsToggles(allAvailableSkills);

        onProviderChange(true);  // skipValueUpdate=true on load
        updateSettingsLabels();
        document.getElementById('settingsOverlay').classList.add('open');
        document.getElementById('settingsPanel').classList.add('open');
      });
    }

    function renderMCPToggles(servers) {
      var list = document.getElementById('mcpToggleList');
      var badge = document.getElementById('mcpBadge');
      var activeCount = servers.filter(function(s) { return s.connected; }).length;
      badge.textContent = activeCount + '/' + servers.length;

      if (servers.length === 0) {
        list.innerHTML = '<div class="toggle-empty">' + t('noMcpServers') + '</div>';
        return;
      }

      list.innerHTML = servers.map(function(s) {
        var statusClass = s.connected ? 'on' : 'off';
        var statusText = s.connected ? s.toolCount + t('tools') : (s.enabled ? t('disconnected') : t('mcpOff'));
        return '<div class="toggle-row" id="mcp-row-' + esc(s.name) + '">' +
          '<div class="toggle-row-info">' +
            '<div class="toggle-row-name">' + esc(s.name) + '</div>' +
            '<div class="toggle-row-desc">' + esc(s.command + ' ' + (s.args || []).join(' ')) + '</div>' +
          '</div>' +
          '<span class="toggle-row-status ' + statusClass + '" id="mcp-status-' + esc(s.name) + '">' + statusText + '</span>' +
          '<label class="toggle-switch">' +
            '<input type="checkbox" ' + (s.enabled ? 'checked' : '') + ' onchange="toggleMCP(\'' + esc(s.name) + '\', this.checked)">' +
            '<span class="toggle-slider"></span>' +
          '</label>' +
        '</div>';
      }).join('');
    }

    function toggleMCP(name, enabled) {
      var row = document.getElementById('mcp-row-' + name);
      var statusEl = document.getElementById('mcp-status-' + name);
      if (!row || !statusEl) return;

      // Show loading
      statusEl.className = 'toggle-row-status off';
      statusEl.innerHTML = '<span class="toggle-loading"></span>';

      fetch('/api/mcp/toggle', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name, enabled: enabled })
      }).then(function(r) { return r.json(); }).then(function(res) {
        if (res.ok) {
          if (res.connected) {
            statusEl.className = 'toggle-row-status on';
            statusEl.textContent = t('connected');
          } else if (res.enabled) {
            statusEl.className = 'toggle-row-status off';
            statusEl.textContent = t('mcpFailed');
          } else {
            statusEl.className = 'toggle-row-status off';
            statusEl.textContent = t('mcpOff');
          }
          // Refresh MCP JSON editor to stay in sync
          fetch('/api/settings').then(function(r) { return r.json(); }).then(function(config) {
            try {
              document.getElementById('setMCP').value = Object.keys(config.mcp || {}).length > 0
                ? JSON.stringify(config.mcp, null, 2) : '';
            } catch(e) {}
          });
          // Update badge
          fetch('/api/mcp/status').then(function(r) { return r.json(); }).then(function(servers) {
            var badge = document.getElementById('mcpBadge');
            var active = servers.filter(function(s) { return s.connected; }).length;
            badge.textContent = active + '/' + servers.length;
          });
          showToast((enabled ? t('mcpStarted') : t('mcpStopped')) + ' [' + name + ']');
        }
      }).catch(function(e) {
        statusEl.className = 'toggle-row-status off';
        statusEl.textContent = t('error');
        showToast(t('mcpToggleFailed') + e.message, true);
      });
    }

    function renderSkillsToggles(allAvailableSkills) {
      var list = document.getElementById('skillsToggleList');
      var badge = document.getElementById('skillsBadge');
      badge.textContent = activeSkills.size + '/' + allAvailableSkills.length;

      if (allAvailableSkills.length === 0) {
        list.innerHTML = '<div class="toggle-empty">' + t('noSkillsFound') + '</div>';
        return;
      }

      list.innerHTML = allAvailableSkills.map(function(s) {
        var isActive = activeSkills.has(s.name);
        return '<div class="toggle-row">' +
          '<div class="toggle-row-info">' +
            '<div class="toggle-row-name">' + esc(s.name) + '</div>' +
            '<div class="toggle-row-desc">' + esc(s.description || s.filename || '') + '</div>' +
          '</div>' +
          '<span class="toggle-row-status ' + (isActive ? 'on' : 'off') + '">' + (isActive ? t('active') : t('off')) + '</span>' +
          '<label class="toggle-switch">' +
            '<input type="checkbox" ' + (isActive ? 'checked' : '') + ' onchange="toggleSkillFromSettings(\'' + esc(s.name) + '\', this)">' +
            '<span class="toggle-slider"></span>' +
          '</label>' +
        '</div>';
      }).join('');
    }

    function toggleSkillFromSettings(name, checkbox) {
      toggleSkill(name);
      // UI will update when we receive skill_toggled from WS
      var row = checkbox.closest('.toggle-row');
      var statusEl = row.querySelector('.toggle-row-status');
      // Optimistic update
      if (checkbox.checked) {
        statusEl.className = 'toggle-row-status on';
        statusEl.textContent = t('active');
      } else {
        statusEl.className = 'toggle-row-status off';
        statusEl.textContent = t('off');
      }
      // Update badge
      var total = document.querySelectorAll('#skillsToggleList .toggle-row').length;
      var active = document.querySelectorAll('#skillsToggleList input:checked').length;
      document.getElementById('skillsBadge').textContent = active + '/' + total;
      // Sidebar skill display removed (managed via settings panel)
    }

    function closeSettings() {
      document.getElementById('settingsOverlay').classList.remove('open');
      document.getElementById('settingsPanel').classList.remove('open');
    }

    function updateSettingsLabels() {
      var titleEl = document.querySelector('.settings-title');
      if (titleEl) {
        var svg = titleEl.querySelector('svg');
        if (svg) titleEl.innerHTML = svg.outerHTML + ' ' + t('settings');
      }
      var cancelBtn = document.querySelector('.settings-footer .cancel-btn');
      if (cancelBtn) cancelBtn.textContent = t('cancel');
      var saveBtn = document.getElementById('saveBtn');
      if (saveBtn) saveBtn.textContent = t('save');
      updateReflectEndpointLabels();
      updateVisionEndpointLabels();
    }

    function saveSettings() {
      var btn = document.getElementById('saveBtn');
      btn.disabled = true;

      var presetValue = document.getElementById('setProvider').value;
      var preset = getPreset(presetValue);
      if (!preset) { btn.disabled = false; return; }

      var config = {};
      config.preset = presetValue;
      config.provider = preset.type; // 'anthropic' or 'openai'

      // BaseURL: always read from input field (preset value is just placeholder)
      var baseURL = document.getElementById('setBaseURL').value.trim();
      if (baseURL) {
        config.baseURL = baseURL;
      } else if (preset.baseURL) {
        config.baseURL = preset.baseURL;  // fallback to preset only if user didn't fill
      }

      var model = document.getElementById('setModel').value.trim();
      if (model) config.model = model;
      var maxTokens = parseInt(document.getElementById('setMaxTokens').value);
      if (maxTokens > 0) config.maxTokens = maxTokens;
      var systemPrompt = document.getElementById('setSystemPrompt').value.trim();
      if (systemPrompt) config.systemPrompt = systemPrompt;
      var mcpText = document.getElementById('setMCP').value.trim();
      try {
        config.mcp = mcpText ? JSON.parse(mcpText) : {};
      } catch(e) {
        showToast(t('mcpJsonError') + e.message, true);
        btn.disabled = false;
        return;
      }

      // Scheduler config — FunnyPi uses plan A/B radio, others disable scheduler
      // (scheduler section is hidden for non-FunnyPi; stale mode from previous
      //  FunnyPi config would override user's custom model — bug fix 2026-03-26)
      if (presetValue === 'funnypi') {
        var selectedPlan = document.querySelector('input[name="funnypiPlan"]:checked');
        config.scheduler = { mode: selectedPlan ? selectedPlan.value : 'performance' };
      } else {
        config.scheduler = { mode: 'none' };
      }

      // Attach independent reflect endpoint config (works with any provider/scheduler mode)
      var reflectEp = buildReflectEndpointConfig();
      if (reflectEp) {
        if (!config.scheduler) config.scheduler = { mode: 'none' };
        config.scheduler.reflectEndpoint = reflectEp;
      }

      // Attach independent vision endpoint config
      var visionEp = buildVisionEndpointConfig();
      if (visionEp) {
        config.visionEndpoint = visionEp;
      }

      // API key: always include in config for config.json persistence,
      // only update .env if the key actually changed
      var apiKeyInput = document.getElementById('setApiKey').value.trim();
      var saveKeyPromise = Promise.resolve();
      if (apiKeyInput) {
        config.apiKey = apiKeyInput;
        if (apiKeyInput !== _originalApiKey) {
          saveKeyPromise = fetch('/api/apikey', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ key: apiKeyInput })
          }).then(function(r) {
            if (!r.ok) throw new Error('Failed to save API Key');
          });
        }
      }

      saveKeyPromise.then(function() {
        return fetch('/api/settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(config)
        }).then(function(r) { return r.json(); });
      }).then(function(res) {
        btn.disabled = false;
        if (res.ok) {
          var parts = [t('settingsSaved')];
          if (res.model) parts.push(t('modelPrefix') + res.model);
          if (res.mcpReloaded && res.mcpReloaded.length > 0) {
            parts.push(t('mcpPrefix') + res.mcpReloaded.join(', '));
          }
          showToast(parts.join(' | '));
          closeSettings();
        }
      }).catch(function(e) {
        btn.disabled = false;
        showToast(t('saveFailed') + e.message, true);
      });
    }

    function showToast(msg, isError) {
      var toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = 'toast' + (isError ? ' error' : '');
      toast.classList.add('show');
      if (_toastTimer) clearTimeout(_toastTimer);
      _toastTimer = setTimeout(function() { toast.classList.remove('show'); _toastTimer = null; }, 3000);
    }

    // ===== File Upload =====
    function handleFileSelect(input) {
      for (var i = 0; i < input.files.length; i++) {
        addFile(input.files[i]);
      }
      input.value = '';
    }

    function addFile(file) {
      if (!file) return;
      // Size check
      if (file.size > 20 * 1024 * 1024) { showToast(t('fileTooLarge'), true); return; }
      // Block dangerous types
      var ext = (file.name.split('.').pop() || '').toLowerCase();
      var blocked = ['exe','bat','cmd','sh','ps1','dll','sys','msi','com','scr','vbs','wsf'];
      if (blocked.indexOf(ext) >= 0) { showToast(t('fileBlocked'), true); return; }

      // ALL images go through compression (no size threshold — phone photos often > 5MB)
      if (file.type.startsWith('image/')) {
        addImageFile(file);
        return;
      }
      // Non-images: HTTP upload
      uploadFileHTTP(file);
    }

    function addImageFile(file) {
      if (!file || !file.type.startsWith('image/')) return;
      if (file.size > 20 * 1024 * 1024) { showToast(t('fileTooLarge'), true); return; }
      // Prefer createImageBitmap — decodes file directly without base64 intermediate,
      // much better memory efficiency on mobile (avoids FileReader + 33% base64 bloat)
      if (typeof createImageBitmap === 'function') {
        createImageBitmap(file).then(function(bitmap) {
          _compressToJpeg(bitmap, bitmap.width, bitmap.height, true);
        }).catch(function() {
          // Fallback to FileReader for unsupported formats
          _compressViaFileReader(file);
        });
      } else {
        // Fallback for older browsers without createImageBitmap
        _compressViaFileReader(file);
      }
    }

    function _compressToJpeg(source, origW, origH, closeable) {
      var TARGET_BYTES = 64 * 1024; // 64KB target
      var maxDim = 768;
      var w = origW, h = origH;
      if (w > maxDim || h > maxDim) {
        if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
        else { w = Math.round(w * maxDim / h); h = maxDim; }
      }
      var canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(source, 0, 0, w, h);
      if (closeable && source.close) source.close();
      // Iterative compression: reduce quality until under 64KB
      var quality = 0.7;
      var compressed = canvas.toDataURL('image/jpeg', quality);
      var b64Len = compressed.length - compressed.indexOf(',') - 1;
      var rawBytes = Math.round(b64Len * 3 / 4);
      while (rawBytes > TARGET_BYTES && quality > 0.15) {
        quality -= 0.1;
        compressed = canvas.toDataURL('image/jpeg', quality);
        b64Len = compressed.length - compressed.indexOf(',') - 1;
        rawBytes = Math.round(b64Len * 3 / 4);
      }
      // Still too large: scale down by redrawing canvas onto itself
      if (rawBytes > TARGET_BYTES) {
        var scale = Math.sqrt(TARGET_BYTES / rawBytes) * 0.9;
        var nw = Math.max(Math.round(w * scale), 64);
        var nh = Math.max(Math.round(h * scale), 64);
        var tmp = document.createElement('canvas');
        tmp.width = nw; tmp.height = nh;
        tmp.getContext('2d').drawImage(canvas, 0, 0, nw, nh);
        canvas.width = nw; canvas.height = nh;
        canvas.getContext('2d').drawImage(tmp, 0, 0);
        tmp.width = 1; tmp.height = 1;
        compressed = canvas.toDataURL('image/jpeg', 0.4);
      }
      canvas.width = 1; canvas.height = 1;
      pendingImages.push(compressed);
      renderAttachmentPreviews();
    }

    function _compressViaFileReader(file) {
      var reader = new FileReader();
      reader.onload = function(e) {
        var img = new Image();
        img.onload = function() {
          _compressToJpeg(img, img.width, img.height, false);
        };
        img.onerror = function() { showToast(t('readImageFail'), true); };
        img.src = e.target.result;
      };
      reader.onerror = function() { showToast(t('readImageFail'), true); };
      reader.readAsDataURL(file);
    }

    function uploadFileHTTP(file) {
      var id = ++_fileIdCounter;
      var entry = { id: id, name: file.name, mime: file.type || 'application/octet-stream', size: file.size, path: '', status: 'uploading', progress: 0, xhr: null };
      pendingFiles.push(entry);
      renderAttachmentPreviews();

      var xhr = new XMLHttpRequest();
      entry.xhr = xhr;
      xhr.open('POST', '/api/upload?name=' + encodeURIComponent(file.name));
      xhr.upload.onprogress = function(e) {
        if (e.lengthComputable) {
          entry.progress = Math.round(e.loaded / e.total * 100);
          renderAttachmentPreviews();
        }
      };
      xhr.onload = function() {
        try {
          var res = JSON.parse(xhr.responseText);
          if (xhr.status === 200 && res.ok) {
            entry.status = 'done';
            entry.path = res.file.path;
            entry.mime = res.file.mime;
            entry.size = res.file.size;
            entry.progress = 100;
          } else {
            entry.status = 'error';
            showToast(t('uploadFailed') + ': ' + (res.error || xhr.status), true);
          }
        } catch(e) {
          entry.status = 'error';
          showToast(t('uploadFailed'), true);
        }
        renderAttachmentPreviews();
      };
      xhr.onerror = function() {
        entry.status = 'error';
        showToast(t('uploadFailed'), true);
        renderAttachmentPreviews();
      };
      xhr.send(file);
    }

    function removeImage(idx) {
      pendingImages.splice(idx, 1);
      renderAttachmentPreviews();
    }

    function removePendingFile(id) {
      for (var i = 0; i < pendingFiles.length; i++) {
        if (pendingFiles[i].id === id) {
          if (pendingFiles[i].xhr && pendingFiles[i].status === 'uploading') {
            pendingFiles[i].xhr.abort();
          }
          pendingFiles.splice(i, 1);
          break;
        }
      }
      renderAttachmentPreviews();
    }

    function formatFileSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1024 / 1024).toFixed(1) + ' MB';
    }

    function getFileIcon(mime) {
      if (mime.startsWith('image/')) return '\uD83D\uDDBC\uFE0F';
      if (mime.startsWith('video/')) return '\uD83C\uDFA5';
      if (mime.startsWith('audio/')) return '\uD83C\uDFB5';
      if (mime.indexOf('pdf') >= 0) return '\uD83D\uDCC4';
      if (mime.indexOf('zip') >= 0 || mime.indexOf('tar') >= 0 || mime.indexOf('gzip') >= 0 || mime.indexOf('7z') >= 0 || mime.indexOf('rar') >= 0) return '\uD83D\uDCE6';
      if (mime.indexOf('sheet') >= 0 || mime.indexOf('excel') >= 0 || mime.indexOf('csv') >= 0) return '\uD83D\uDCCA';
      if (mime.indexOf('presentation') >= 0 || mime.indexOf('powerpoint') >= 0) return '\uD83D\uDCCA';
      if (mime.indexOf('word') >= 0 || mime.indexOf('document') >= 0) return '\uD83D\uDCC3';
      return '\uD83D\uDCC1';
    }

    function renderAttachmentPreviews() {
      var bar = document.getElementById('imagePreviewBar');
      var html = '';
      // Image previews
      for (var i = 0; i < pendingImages.length; i++) {
        html += '<div class="img-preview">' +
          '<img src="' + pendingImages[i] + '">' +
          '<button class="img-preview-remove" onclick="removeImage(' + i + ')">\u00D7</button>' +
        '</div>';
      }
      // File previews
      for (var j = 0; j < pendingFiles.length; j++) {
        var f = pendingFiles[j];
        var statusClass = f.status === 'error' ? ' error' : (f.status === 'done' ? ' done' : '');
        html += '<div class="file-pending' + statusClass + '">' +
          '<span class="file-pending-icon">' + getFileIcon(f.mime) + '</span>' +
          '<div class="file-pending-info">' +
            '<div class="file-pending-name">' + esc(f.name) + '</div>' +
            '<div class="file-pending-meta">' + formatFileSize(f.size) +
              (f.status === 'uploading' ? ' - ' + f.progress + '%' : '') +
              (f.status === 'error' ? ' - ' + t('uploadFailed') : '') +
            '</div>' +
            (f.status === 'uploading' ? '<div class="file-pending-progress"><div class="file-pending-progress-bar" style="width:' + f.progress + '%"></div></div>' : '') +
          '</div>' +
          '<button class="file-pending-remove" onclick="removePendingFile(' + f.id + ')">\u00D7</button>' +
        '</div>';
      }
      bar.innerHTML = html;
    }

    // ===== Chat =====
    function handleAction() {
      if (sending) stopGeneration();
      else sendMessage();
    }

    function stopGeneration() {
      wsSend({ type: 'stop' });
      resetStreamingState();
    }

    function sendMessage() {
      if (sending) return;
      // Block if files are still uploading
      var uploading = pendingFiles.filter(function(f) { return f.status === 'uploading'; });
      if (uploading.length > 0) { showToast(t('filesStillUploading'), true); return; }
      // Remove errored files
      pendingFiles = pendingFiles.filter(function(f) { return f.status === 'done'; });

      var input = document.getElementById('msgInput');
      var content = input.value.trim();
      var hasAttachments = pendingImages.length > 0 || pendingFiles.length > 0;
      if (!content && !hasAttachments) return;
      if (!content && pendingImages.length > 0 && pendingFiles.length === 0) content = t('whatInImage');
      if (!content && hasAttachments) content = '';
      input.value = '';
      input.style.height = 'auto';

      if (content.charAt(0) === '/' && !hasAttachments) {
        handleCommand(content);
        return;
      }

      // Show user message with image thumbnails and file cards
      var container = document.getElementById('chatContainer');
      if (hasAttachments || content) {
        var div = document.createElement('div');
        div.className = 'message user';
        var html = content ? esc(content) : '';
        for (var i = 0; i < pendingImages.length; i++) {
          html += '<br><img class="chat-image" src="' + pendingImages[i] + '">';
        }
        for (var j = 0; j < pendingFiles.length; j++) {
          var pf = pendingFiles[j];
          html += '<div class="user-file-card">' +
            '<span class="user-file-card-icon">' + getFileIcon(pf.mime) + '</span>' +
            '<div class="user-file-card-info">' +
              '<div class="user-file-card-name">' + esc(pf.name) + '</div>' +
              '<div class="user-file-card-meta">' + formatFileSize(pf.size) + '</div>' +
            '</div></div>';
        }
        div.innerHTML = html;
        container.appendChild(div);
        scrollToBottom();
      }

      setSending(true);
      var msgData = { type: 'chat', content: content, sessionId: currentSessionId };
      if (pendingImages.length > 0) {
        msgData.images = pendingImages.slice();
      }
      if (pendingFiles.length > 0) {
        msgData.files = pendingFiles.map(function(f) {
          return { path: f.path, name: f.name, mime: f.mime, size: f.size };
        });
      }
      wsSend(msgData);
      pendingImages = [];
      pendingFiles = [];
      renderAttachmentPreviews();
    }

    function handleCommand(input) {
      var cmd = input.toLowerCase();
      var spaceIdx = input.indexOf(' ');
      var args = spaceIdx >= 0 ? input.slice(spaceIdx + 1).trim() : '';

      if (cmd === '/help') {
        appendSystem(t('helpText'));
        return;
      }
      if (cmd === '/new') { newSession(); return; }
      if (cmd === '/settings') { openSettings(); return; }
      if (cmd === '/sessions') {
        loadSessions();
        if (window.innerWidth > 768) appendSystem(t('sessionsRefreshed'));
        else toggleSidebar();
        return;
      }
      if (cmd.startsWith('/switch ') && args) {
        fetch('/api/sessions').then(function(r) { return r.json(); }).then(function(sessions) {
          var match = sessions.find(function(s) { return s.id.startsWith(args); });
          if (match) { switchSession(match.id); appendSystem(t('switchedTo') + match.title); }
          else appendSystem(t('sessionNotFound') + args);
        });
        return;
      }
      if (cmd.startsWith('/delete')) {
        if (cmd === '/delete' && currentSessionId) { deleteSession(currentSessionId); }
        else if (args) {
          fetch('/api/sessions').then(function(r) { return r.json(); }).then(function(sessions) {
            var match = sessions.find(function(s) { return s.id.startsWith(args); });
            if (match) { deleteSession(match.id); }
            else appendSystem(t('notFound') + args);
          });
        }
        return;
      }
      if (cmd === '/skills') {
        if (skills.length === 0) appendSystem(t('noSkills'));
        else {
          var lines = skills.map(function(s) {
            return '  /' + s.name + '  ' + s.description + (activeSkills.has(s.name) ? ' [ON]' : '');
          });
          appendSystem(t('skillsLabel') + ':\n' + lines.join('\n'));
        }
        return;
      }
      if (cmd === '/clear') { document.getElementById('chatContainer').innerHTML = ''; return; }

      var skillParts = input.slice(1).split(/\s+/);
      var skillName = skillParts[0];
      var skillArgs = skillParts.slice(1).join(' ');
      var skill = skills.find(function(s) { return s.name === skillName; });
      if (skill) {
        // Ensure skill is activated before invoking
        if (!activeSkills.has(skillName)) {
          toggleSkill(skillName);
        }
        // Send skill invocation as a user message to the AI
        var invokeMsg = '[Invoke Skill: ' + skill.name + ']';
        if (skillArgs) invokeMsg += ' ' + skillArgs;
        appendMessage('user', input);
        setSending(true);
        wsSend({ type: 'chat', content: invokeMsg, sessionId: currentSessionId });
        return;
      }

      appendSystem(t('unknownCmd') + input + t('typeHelp'));
    }

    function appendSystem(text) {
      var container = document.getElementById('chatContainer');
      var div = document.createElement('div');
      div.className = 'system-msg';
      div.textContent = text;
      container.appendChild(div);
      scrollToBottom();
    }

    function setSending(state) {
      sending = state;
      var btn = document.getElementById('actionBtn');
      if (state) {
        btn.className = 'action-btn stop-btn';
        btn.innerHTML = STOP_ICON;
      } else {
        btn.className = 'action-btn send-btn';
        btn.innerHTML = SEND_ICON;
      }
    }

    // ===== DOM Helpers =====
    function appendMessage(role, content) {
      if (!content || !content.trim()) return;
      var el = appendMessageEl(role);
      if (role === 'assistant') {
        el.querySelector('.msg-content').innerHTML = renderMarkdown(content);
      } else {
        el.textContent = content;
      }
      scrollToBottom();
    }

    function appendMessageEl(role) {
      var container = document.getElementById('chatContainer');
      var div = document.createElement('div');
      div.className = 'message ' + role;
      if (role === 'assistant') {
        div.innerHTML = '<button class="copy-btn" onclick="copyMessage(this)" title="Copy">' + COPY_ICON + '</button><div class="msg-content"></div>';
      }
      container.appendChild(div);
      return div;
    }

    function copyMessage(btn) {
      var contentEl = btn.parentElement.querySelector('.msg-content');
      if (!contentEl) return;
      var text = contentEl.innerText;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function() {
          showCopied(btn);
        }).catch(function() {
          fallbackCopy(text, btn);
        });
      } else {
        fallbackCopy(text, btn);
      }
    }

    function fallbackCopy(text, btn) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;left:-9999px';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); showCopied(btn); }
      catch(e) { showToast(t('copyFailed'), true); }
      document.body.removeChild(ta);
    }

    function showCopied(btn) {
      btn.innerHTML = CHECK_SVG;
      btn.classList.add('copied');
      setTimeout(function() {
        btn.innerHTML = COPY_ICON;
        btn.classList.remove('copied');
      }, 2000);
    }

    function isScrolledToBottom() {
      var c = document.getElementById('chatContainer');
      return c.scrollHeight - c.scrollTop - c.clientHeight < 100;
    }

    function scrollToBottom(force) {
      // Only auto-scroll if user is already near bottom
      if (!isScrolledToBottom()) return;
      if (_scrollRAF) return;
      _scrollRAF = requestAnimationFrame(function() {
        var c = document.getElementById('chatContainer');
        c.scrollTop = c.scrollHeight;
        _scrollRAF = null;
      });
    }

    function setStatus(connected) {
      document.getElementById('statusDot').className = 'status-dot ' + (connected ? 'connected' : 'disconnected');
      document.getElementById('statusText').textContent = connected ? t('connected') : t('disconnected');
    }

    function updateSessionInfo() {
      document.getElementById('sessionInfo').textContent =
        currentSessionId ? t('sessionPrefix') + currentSessionId.slice(0, 8) : t('noSession');
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('overlay').classList.toggle('open');
    }

    // ===== Markdown (XSS-safe) =====
    function stripLeakedXML(t) {
      return t
        .replace(/<tool_call>[\s\S]*?<\/tool_call>/g, '')
        .replace(/<function_call>[\s\S]*?<\/function_call>/g, '')
        .replace(/<tool_calls>[\s\S]*?<\/tool_calls>/g, '')
        .replace(/<arg_key>[\s\S]*?<\/arg_key>/g, '')
        .replace(/<arg_value>[\s\S]*?<\/arg_value>/g, '')
        .replace(/<\|tool_call\|>[\s\S]*?(<\|\/tool_call\|>|<\|im_end\|>)/g, '')
        .replace(/<\|im_start\|>tool_call[\s\S]*?<\|im_end\|>/g, '')
        .replace(/<\|startoftool\|>[\s\S]*?<\|endoftool\|>/g, '')
        .replace(/\[TOOL_CALL\][\s\S]*?\[\/TOOL_CALL\]/g, '')
        .replace(/<(tool_call|function_call|arg_key|arg_value|tool_calls)\b[^>]*>(?![^<]*<\/\1>)/g, '')
        .replace(/\S*<\/(arg_key|arg_value|tool_call|function_call|tool_calls)>/g, '')
        .replace(/\n{3,}/g, '\n\n').trim();
    }
    function renderMarkdown(text) {
      if (!text) return '';
      text = stripLeakedXML(text);
      text = esc(text);
      
      // Code blocks with syntax highlighting
      text = text.replace(/```(\w*)\n([\s\S]*?)```/g, function(_, lang, code) {
        return '<pre><code class="language-' + (lang || 'text') + '">' + code.trim() + '</code></pre>';
      });
      
      // Inline code
      text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
      
      // Bold (before italic)
      text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      
      // Italic
      text = text.replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g, '<em>$1</em>');
      
      // Headers
      text = text.replace(/^### (.+)$/gm, '<h3>$1</h3>');
      text = text.replace(/^## (.+)$/gm, '<h2>$1</h2>');
      text = text.replace(/^# (.+)$/gm, '<h1>$1</h1>');
      
      // Blockquotes
      text = text.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');
      
      // Horizontal rule
      text = text.replace(/^---$/gm, '<hr>');
      
      // Tables
      text = text.replace(/^\|(.+)\|$/gm, function(_, content) {
        var cells = content.split('|').map(function(c) { return c.trim(); });
        return '<tr>' + cells.map(function(c) { return '<td>' + c + '</td>'; }).join('') + '</tr>';
      });
      text = text.replace(/^\|?(:?-+:?|-+)\|$/gm, '<thead></thead>');
      
      // Images — ![alt](url) — only allow http/https and safe data: image URIs (no svg to prevent XSS)
      text = text.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, function(_, alt, url) {
        if (!/^(https?:\/\/|data:image\/(png|jpeg|gif|webp|bmp))/i.test(url)) return '![' + alt + '](' + url + ')';
        var safeAlt = alt.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        return '<div class="md-img-wrap"><img src="' + url + '" alt="' + safeAlt + '" class="md-img" onclick="openImageViewer(this.src, this.alt)" /></div>';
      });
      
      // Links — only allow http/https (XSS fix: block javascript:)
      text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function(_, label, url) {
        if (!/^https?:\/\//i.test(url)) return label;
        return '<a href="' + url + '" target="_blank" rel="noopener">' + label + '</a>';
      });
      
      // Unordered lists
      text = text.replace(/^- (.+)$/gm, '<li>$1</li>');
      text = text.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
      
      // Ordered lists
      text = text.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
      
      // Paragraphs
      var parts = text.split(/\n{2,}/);
      if (parts.length > 1) {
        text = parts.map(function(p) {
          p = p.trim();
          if (!p) return '';
          if (p.indexOf('<pre>') >= 0 || p.indexOf('<ul>') >= 0 || p.indexOf('<h') >= 0 || p.indexOf('<blockquote') >= 0) return p;
          return '<p>' + p.replace(/\n/g, '<br>') + '</p>';
        }).join('');
      } else {
        text = text.replace(/\n/g, '<br>');
      }
      return text;
    }

    function esc(s) {
      _escDiv.textContent = s || '';
      return _escDiv.innerHTML;
    }

    // ===== Image Viewer =====
    function openImageViewer(src, name) {
      var overlay = document.createElement('div');
      overlay.className = 'image-viewer-overlay';
      // Unified close function to prevent ESC listener leak
      var escHandler;
      function closeViewer() {
        overlay.remove();
        document.removeEventListener('keydown', escHandler);
      }
      overlay.onclick = function(e) { if (e.target === overlay) closeViewer(); };
      // Close button — DOM API
      var closeBtn = document.createElement('button');
      closeBtn.className = 'image-viewer-close';
      closeBtn.textContent = '\u00D7';
      closeBtn.onclick = closeViewer;
      overlay.appendChild(closeBtn);
      // Image — DOM API (no innerHTML XSS risk)
      var img = document.createElement('img');
      img.src = src;
      img.alt = name || '';
      overlay.appendChild(img);
      // Bottom bar
      var bar = document.createElement('div');
      bar.className = 'image-viewer-bar';
      var nameSpan = document.createElement('span');
      nameSpan.className = 'image-viewer-name';
      nameSpan.textContent = name || '';
      var dlLink = document.createElement('a');
      dlLink.className = 'image-viewer-dl';
      dlLink.href = src;
      dlLink.download = name || 'image';
      dlLink.textContent = t('download');
      bar.appendChild(nameSpan);
      bar.appendChild(dlLink);
      overlay.appendChild(bar);
      document.body.appendChild(overlay);
      // ESC to close
      escHandler = function(e) { if (e.key === 'Escape') closeViewer(); };
      document.addEventListener('keydown', escHandler);
    }

    // ===== Textarea =====
    var _autoResizeTimer = null;
    function autoResize(el) {
      if (_autoResizeTimer) return;
      _autoResizeTimer = requestAnimationFrame(function() {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 150) + 'px';
        _autoResizeTimer = null;
      });
    }

    // ===== Key handling =====
    document.getElementById('msgInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (sending) return;
        sendMessage();
      }
    });

    // Toggle thinking blocks
    document.getElementById('chatContainer').addEventListener('click', function(e) {
      var header = e.target.closest('.thinking-header');
      if (header) header.parentElement.classList.toggle('collapsed');
    });

    // Paste file/image support
    document.addEventListener('paste', function(e) {
      var items = e.clipboardData && e.clipboardData.items;
      if (!items) return;
      for (var i = 0; i < items.length; i++) {
        var item = items[i];
        if (item.kind === 'file') {
          e.preventDefault();
          addFile(item.getAsFile());
        }
      }
    });

    // Drag & drop with overlay
    var _dragCounter = 0;
    document.body.addEventListener('dragenter', function(e) {
      e.preventDefault();
      _dragCounter++;
      if (_dragCounter === 1) {
        var overlay = document.getElementById('dropOverlay');
        document.getElementById('dropOverlayText').textContent = t('dropHere');
        overlay.style.display = 'flex';
      }
    });
    document.body.addEventListener('dragleave', function(e) {
      e.preventDefault();
      _dragCounter--;
      if (_dragCounter <= 0) {
        _dragCounter = 0;
        document.getElementById('dropOverlay').style.display = 'none';
      }
    });
    document.body.addEventListener('dragover', function(e) { e.preventDefault(); });
    document.body.addEventListener('drop', function(e) {
      e.preventDefault();
      _dragCounter = 0;
      document.getElementById('dropOverlay').style.display = 'none';
      if (e.dataTransfer && e.dataTransfer.files) {
        for (var i = 0; i < e.dataTransfer.files.length; i++) {
          addFile(e.dataTransfer.files[i]);
        }
      }
    });

    // Prevent overlay scroll bleed
    document.getElementById('overlay').addEventListener('touchmove', function(e) {
      e.preventDefault();
    }, { passive: false });

    // iOS keyboard viewport fix — prevent page push-up
    if (window.visualViewport) {
      var _vvRAF = null;
      function onViewportChange() {
        if (_vvRAF) return;
        _vvRAF = requestAnimationFrame(function() {
          _vvRAF = null;
          var vv = window.visualViewport;
          var offsetTop = vv.offsetTop;
          document.body.style.height = vv.height + 'px';
          document.body.style.transform = 'translateY(' + offsetTop + 'px)';
          // keep chat scrolled to bottom when keyboard opens
          var c = document.getElementById('chatContainer');
          if (c) c.scrollTop = c.scrollHeight;
        });
      }
      window.visualViewport.addEventListener('resize', onViewportChange);
      window.visualViewport.addEventListener('scroll', onViewportChange);
    }

    // iOS: prevent body scroll when keyboard is open
    document.addEventListener('touchmove', function(e) {
      var t = e.target;
      while (t && t !== document.body) {
        var ov = window.getComputedStyle(t).overflowY;
        if (ov === 'auto' || ov === 'scroll') return;
        t = t.parentElement;
      }
      if (window.visualViewport && window.visualViewport.height < window.innerHeight * 0.85) {
        e.preventDefault();
      }
    }, { passive: false });

    // ===== WiFi =====
    var _wifiSSID = null;

    function openWiFi() {
      var panel = document.getElementById('wifiPanel');
      panel.style.display = 'block';
      document.getElementById('wifiTitle').textContent = currentLang === 'zh' ? '网络设置' : 'Network';
      // Animate in
      requestAnimationFrame(function() {
        panel.querySelector('.wifi-overlay').classList.add('show');
        panel.querySelector('.wifi-modal').classList.add('show');
      });
      wifiRefreshStatus();
      wifiScan();
    }

    function closeWiFi() {
      var panel = document.getElementById('wifiPanel');
      panel.querySelector('.wifi-overlay').classList.remove('show');
      panel.querySelector('.wifi-modal').classList.remove('show');
      setTimeout(function() { panel.style.display = 'none'; }, 200);
      _wifiSSID = null;
      _wifiAutoScanning = false; // reset so auto-scan works next time
      document.getElementById('wifiConnect').style.display = 'none';
    }

    var _wifiAutoScanning = false;

    function wifiRefreshStatus() {
      var el = document.getElementById('wifiStatus');
      el.className = 'wifi-status-box';
      el.innerHTML = currentLang === 'zh' ? '检测中...' : 'Checking...';
      fetch('/api/wifi/status').then(function(r) { return r.json(); }).then(function(d) {
        if (d.hotspot) {
          el.className = 'wifi-status-box ap';
          el.innerHTML = '<strong>' + (currentLang === 'zh' ? '热点模式' : 'Hotspot Mode') + '</strong>' +
            'PiWeb-Setup' +
            '<div class="wifi-ip">IP: 10.42.0.1</div>';
        } else if (d.connected) {
          el.className = 'wifi-status-box ok';
          el.innerHTML = '<strong>' + (currentLang === 'zh' ? '已连接' : 'Connected') + '</strong>' +
            (d.ssid || 'Unknown') +
            '<div class="wifi-ip">IP: ' + (d.ip || '?') + ':3000</div>';
        } else {
          el.className = 'wifi-status-box err';
          el.innerHTML = '<strong>' + (currentLang === 'zh' ? '未连接' : 'Disconnected') + '</strong>' +
            (currentLang === 'zh' ? '请选择一个 WiFi 网络' : 'Select a WiFi network');
        }
      }).catch(function() {
        // Server unreachable — PiWeb moved, auto-scan to find it
        el.className = 'wifi-status-box';
        el.innerHTML = '<strong>Server unreachable</strong>Scanning for PiWeb on network...';
        if (!_wifiAutoScanning) {
          _wifiAutoScanning = true;
          var btn = document.getElementById('wifiGoBtn');
          btn.disabled = true;
          btn.textContent = 'Scanning...';
          wifiStartScan('', location.hostname, location.port || '3000', btn, el);
        }
      });
    }

    function wifiScan() {
      var el = document.getElementById('wifiList');
      el.innerHTML = '<div class="wifi-empty">' + (currentLang === 'zh' ? '扫描中...' : 'Scanning...') + '</div>';
      document.getElementById('wifiConnect').style.display = 'none';
      _wifiSSID = null;

      fetch('/api/wifi/scan').then(function(r) { return r.json(); }).then(function(d) {
        if (!d.networks || !d.networks.length) {
          el.innerHTML = '<div class="wifi-empty">' + (currentLang === 'zh' ? '未发现 WiFi' : 'No networks found') + '</div>';
          return;
        }
        el.innerHTML = d.networks.map(function(n) {
          var bars = [20, 40, 60, 80].map(function(t, i) {
            return '<span style="height:' + (5 + i * 3) + 'px" class="' + (n.signal >= t ? 'on' : '') + '"></span>';
          }).join('');
          return '<div class="wifi-item' + (n.connected ? ' active' : '') + '" onclick="wifiSelect(\'' + n.ssid.replace(/'/g, "\\'").replace(/\\/g, "\\\\") + '\')">' +
            '<div><div class="wifi-ssid">' + n.ssid + (n.connected ? ' &#10003;' : '') + '</div>' +
            '<div class="wifi-meta">' + (n.security || 'Open') + ' · ' + n.signal + '%</div></div>' +
            '<div class="wifi-bars">' + bars + '</div></div>';
        }).join('');
      }).catch(function() {
        el.innerHTML = '<div class="wifi-empty">Server unreachable — scanning for PiWeb...</div>';
      });
    }

    function wifiSelect(ssid) {
      _wifiSSID = ssid;
      var box = document.getElementById('wifiConnect');
      box.style.display = 'block';
      document.getElementById('wifiTarget').textContent = ssid;
      var inp = document.getElementById('wifiPwd');
      inp.value = '';
      inp.focus();
      // Enter key to connect
      inp.onkeydown = function(e) { if (e.key === 'Enter') wifiDoConnect(); };
      var btn = document.getElementById('wifiGoBtn');
      btn.textContent = currentLang === 'zh' ? '连接' : 'Connect';
      btn.disabled = false;
      btn.style.background = '';
    }

    function wifiDoConnect() {
      if (!_wifiSSID) return;
      var pwd = document.getElementById('wifiPwd').value;
      var btn = document.getElementById('wifiGoBtn');
      var statusEl = document.getElementById('wifiStatus');
      btn.disabled = true;
      btn.textContent = 'Switching...';
      var targetSSID = _wifiSSID;
      var oldHost = location.hostname;
      var port = location.port || '3000';

      fetch('/api/wifi/connect', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ssid: targetSSID, password: pwd })
      }).then(function(r) { return r.json(); }).then(function(d) {
        if (d.accepted) {
          wifiWaitForDrop(targetSSID, oldHost, port, btn, statusEl);
        } else if (d.error) {
          btn.textContent = 'Failed';
          btn.style.background = 'var(--red)';
          statusEl.className = 'wifi-status-box err';
          statusEl.innerHTML = '<strong>Error</strong>' + d.error;
          setTimeout(function() {
            btn.textContent = currentLang === 'zh' ? '连接' : 'Connect';
            btn.style.background = '';
            btn.disabled = false;
          }, 3000);
        }
      }).catch(function() {
        // Request itself failed — network already changing
        wifiStartScan(targetSSID, oldHost, port, btn, statusEl);
      });
    }

    // Phase 1: heartbeat old IP + poll switch-result — detect outcome fast
    function wifiWaitForDrop(targetSSID, oldHost, port, btn, statusEl) {
      var elapsed = 0;
      var resolved = false;
      statusEl.className = 'wifi-status-box';
      statusEl.innerHTML = '<strong>Switching to ' + targetSSID + '...</strong>' +
        'Waiting for network change';

      function checkSwitchResult() {
        if (resolved) return;
        var ctrl2 = new AbortController();
        var t2 = setTimeout(function() { ctrl2.abort(); }, 2000);
        fetch('http://' + oldHost + ':' + port + '/api/wifi/switch-result', { signal: ctrl2.signal })
          .then(function(r) { clearTimeout(t2); return r.json(); })
          .then(function(result) {
            if (resolved) return;
            if (result.status === 'connected' && result.ip) {
              // Relay says connected at new IP — redirect directly (skip scan!)
              resolved = true;
              wifiRedirectTo(result.ip, port, targetSSID, btn, statusEl);
            } else if (result.status === 'rolled_back') {
              // Switch failed, rolled back to previous network
              resolved = true;
              statusEl.className = 'wifi-status-box err';
              statusEl.innerHTML = '<strong>Switch failed</strong>' +
                (result.error || 'Rolled back to previous network');
              btn.textContent = 'Connect';
              btn.style.background = '';
              btn.disabled = false;
            } else if (result.status === 'failed') {
              // Switch failed completely
              resolved = true;
              statusEl.className = 'wifi-status-box err';
              statusEl.innerHTML = '<strong>Switch failed</strong>' +
                (result.error || 'Could not connect');
              btn.textContent = 'Connect';
              btn.style.background = '';
              btn.disabled = false;
            }
            // status 'switching' or 'pending' or 'none' — keep waiting
          })
          .catch(function() { clearTimeout(t2); });
      }

      function heartbeat() {
        if (resolved) return;
        // Poll switch-result in parallel with heartbeat
        checkSwitchResult();

        var ctrl = new AbortController();
        var t = setTimeout(function() { ctrl.abort(); }, 1500);
        fetch('http://' + oldHost + ':' + port + '/api/wifi/status', { signal: ctrl.signal })
          .then(function(r) {
            clearTimeout(t);
            return r.json();
          })
          .then(function() {
            if (resolved) return;
            // Still alive — keep waiting
            elapsed++;
            btn.textContent = 'Switching... ' + elapsed + 's';
            if (elapsed > 60) {
              // Timeout: switch never happened
              statusEl.className = 'wifi-status-box err';
              statusEl.innerHTML = '<strong>Switch timeout</strong>Pi did not change network';
              btn.textContent = 'Connect';
              btn.disabled = false;
              return;
            }
            setTimeout(heartbeat, 1000);
          })
          .catch(function() {
            if (resolved) return;
            // Connection dropped — network change detected!
            clearTimeout(t);
            wifiStartScan(targetSSID, oldHost, port, btn, statusEl);
          });
      }
      heartbeat();
    }

    // Phase 2: continuous scan — stride pattern, repeating passes
    function wifiStartScan(targetSSID, oldHost, port, btn, statusEl) {
      var found = false;
      var startTime = Date.now();
      var MAX_TIME = 180000; // 3 min max
      var pass = 0;

      // Build candidates: interleaved subnets, stride 1,3,5..2,4,6
      var prefixes = [];
      var oldParts = oldHost.split('.');
      if (oldParts.length === 4) {
        prefixes.push(oldParts[0] + '.' + oldParts[1] + '.' + oldParts[2] + '.');
      }
      var common = ['192.168.31.', '192.168.0.', '192.168.1.', '192.168.2.', '192.168.50.', '10.0.0.'];
      for (var c = 0; c < common.length; c++) {
        if (prefixes.indexOf(common[c]) === -1) prefixes.push(common[c]);
      }
      // Stride: odd IPs first (1,3,5,...253), then even (2,4,6,...254)
      // Interleaved across all subnets
      var candidates = [];
      for (var i = 1; i <= 254; i += 2) {
        for (var p = 0; p < prefixes.length; p++) {
          var ip = prefixes[p] + i;
          if (ip !== oldHost) candidates.push(ip);
        }
      }
      for (var i = 2; i <= 254; i += 2) {
        for (var p = 0; p < prefixes.length; p++) {
          var ip = prefixes[p] + i;
          if (ip !== oldHost) candidates.push(ip);
        }
      }
      var total = candidates.length;

      btn.textContent = 'Scanning...';
      statusEl.className = 'wifi-status-box';
      statusEl.innerHTML = '<strong>Network changed!</strong>Scanning for PiWeb...';

      function runPass() {
        if (found) return;
        if (Date.now() - startTime > MAX_TIME) {
          statusEl.className = 'wifi-status-box err';
          statusEl.innerHTML = '<strong>PiWeb not found</strong>' +
            (pass + 1) + ' passes, ' + total + ' addresses each.<br>' +
            'Make sure your device is on the same network.';
          btn.textContent = 'Retry';
          btn.disabled = false;
          btn.onclick = function() {
            btn.onclick = null;
            btn.disabled = true;
            startTime = Date.now();
            pass = 0;
            wifiStartScan(targetSSID, oldHost, port, btn, statusEl);
          };
          return;
        }

        pass++;
        var idx = 0, active = 0, scanned = 0;
        var CONCURRENCY = 30;
        var TIMEOUT = 2000;

        function launch() {
          while (active < CONCURRENCY && idx < total && !found) {
            (function(ip) {
              active++;
              var ctrl = new AbortController();
              var t = setTimeout(function() { ctrl.abort(); }, TIMEOUT);
              fetch('http://' + ip + ':' + port + '/api/wifi/status', { signal: ctrl.signal, mode: 'cors' })
                .then(function(r) {
                  clearTimeout(t);
                  return r.json().then(function(d) {
                    if (!found && d && (d.url || d.hostname)) {
                      found = true;
                      wifiRedirectTo(ip, port, d.ssid || targetSSID, btn, statusEl);
                    }
                  });
                })
                .catch(function() { clearTimeout(t); })
                .finally(function() {
                  active--;
                  scanned++;
                  if (!found) {
                    if (scanned % 100 === 0) {
                      var sec = Math.round((Date.now() - startTime) / 1000);
                      statusEl.innerHTML = '<strong>Scanning (pass ' + pass + ')...</strong>' +
                        scanned + '/' + total + ' | ' + sec + 's elapsed';
                    }
                    launch();
                  }
                });
            })(candidates[idx++]);
          }
          // Pass done — start next pass immediately
          if (active === 0 && !found) {
            setTimeout(runPass, 2000);
          }
        }
        launch();
      }

      runPass();
    }

    function wifiRedirectTo(ip, port, ssid, btn, statusEl) {
      statusEl.className = 'wifi-status-box ok';
      statusEl.innerHTML = '<strong>Found PiWeb!</strong>' + ssid +
        '<div class="wifi-ip">IP: ' + ip + ':' + port + '</div>' +
        '<div style="margin-top:4px">Redirecting...</div>';
      btn.textContent = 'Redirecting...';
      setTimeout(function() { window.location.href = 'http://' + ip + ':' + port; }, 1500);
    }

    // ===== Init =====
    // Apply saved preferences
    document.documentElement.style.setProperty('--font-scale', FONT_SIZES[currentFontSize]);
    document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : 'en';
    updateThemeIcons();
    applyLang();

    // Pre-fetch current session via HTTP immediately (don't wait for WebSocket)
    // This eliminates the empty→full visual jump on page load
    if (currentSessionId) {
      fetch('/api/sessions/' + encodeURIComponent(currentSessionId))
        .then(function(r) { return r.ok ? r.json() : null; })
        .then(function(session) {
          if (session && session.id === currentSessionId) {
            var container = document.getElementById('chatContainer');
            if (!container.hasChildNodes()) {
              renderSessionMessages(session);
            }
          }
        })
        .catch(function() {});
    }

    connectWs();
    updateSessionInfo();
    loadSkills();

    // BUG2: reveal body only after preferences (theme/lang/font) are applied to prevent flicker
    document.body.classList.add('ready');

    // PWA Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(function() {});
    }
  </script>
